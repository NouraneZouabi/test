name:  integration contenu (projet test)

on:
  push:
    branches: main

jobs:
  Build_test_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: build frontend 
        run: |
          docker build -t nouran10/angular angular-app
          docker push nouran10/angular

      - name: build artifact 
        run: |
          cd springboot/app 
          chmod +x mvnw
          ./mvnw clean package 

      - name: build frontend 
        run: |
          docker build -t nouran10/spring springboot/app
          docker push nouran10/spring

